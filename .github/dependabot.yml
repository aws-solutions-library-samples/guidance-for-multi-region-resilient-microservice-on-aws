version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/source/checkout"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "javascript"
      - "auto-approve"
      - "auto-merge"
    groups:
      # Every npm update in this directory rewrites the same
      # source/checkout/package-lock.json, so one PR per dependency means the
      # first to merge leaves the rest conflicting. Group the directory into a
      # single PR: one lock file change per cycle, nothing to conflict with.
      checkout:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/source/catalog"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "go"
      - "auto-approve"
      - "auto-merge"

  - package-ecosystem: "maven"
    directories:
      - "/source/ui"
      - "/source/cart"
      - "/source/orders"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "java"
      - "auto-approve"
      - "auto-merge"
    ignore:
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.testcontainers:testcontainers"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directories:
      - "/deployment/database/crdr-reconciliation/src/function"
      - "/deployment/database/secrets-rotation/src/function"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"
      - "auto-approve"
      - "auto-merge"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
      - "auto-approve"
      - "auto-merge"

# Force Dependabot to re-evaluate all ecosystems and create fresh PRs
# Last triggered: 2026-07-06
